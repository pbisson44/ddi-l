version: 2

updates:
  # Keeps pinned actions current, including the SHA-pinned publish action.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: "ci"

  # One grouped monthly PR for uv.lock. ruff and mypy are bumped by hand.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
    groups:
      python-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "ruff"
          - "mypy"
    ignore:
      - dependency-name: "ruff"
      - dependency-name: "mypy"
