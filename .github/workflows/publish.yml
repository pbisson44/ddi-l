name: Publish to PyPI

# Publishing a GitHub Release uploads to PyPI. `workflow_dispatch` publishes
# to TestPyPI (a dry run) or retries a failed PyPI upload.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: "Target index"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

# PyPI filenames are immutable; never run two publishes at once.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# Same uv as ci.yml, which runs the same `make release-check`.
env:
  UV_VERSION: "0.13.7"

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install build tooling
        run: uv sync --locked --group dev

      # Asset assertions, a top-level-package guard, and a clean-venv install
      # that validates a real document -- the same checks CI runs.
      - name: Run release checks
        run: uv run make release-check

      - name: Check metadata renders on PyPI
        run: uv run --with twine twine check --strict dist/*

      - name: Verify ddi-l-native has ddi-l's version
        # ddi-l depends on ddi-l-native at its own version: the compiled
        # wheels below, or the stand-in wheel `make release-check` built.
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import tomllib
          from pathlib import Path

          def version(path):
              return tomllib.loads(Path(path).read_text())
          project = version("pyproject.toml")["project"]
          ddi_l = project["version"]
          native = version("native/pyproject.toml")["project"]["version"]
          crate = version("native/Cargo.toml")["package"]["version"]
          stand_in = version("native/fallback/pyproject.toml")["project"]["version"]
          assert ddi_l == native == crate == stand_in, (ddi_l, native, crate, stand_in)
          assert f"ddi-l-native=={ddi_l}" in project["dependencies"], project["dependencies"]
          PY

      - name: Verify the tag matches the packaged version
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          packaged=$(uv run python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tag="${{ github.event.release.tag_name }}"
          echo "packaged=$packaged tag=$tag"
          if [ "$tag" != "$packaged" ] && [ "$tag" != "v$packaged" ]; then
            echo "::error::Release tag '$tag' does not match pyproject version '$packaged'."
            exit 1
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  native-wheels:
    # ddi-l-native: one abi3 wheel per platform serves every CPython from 3.11.
    # Anywhere else pip takes the stand-in wheel, so it never compiles Rust.
    name: Build ddi-l-native (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: auto }
          - { platform: linux-aarch64, runner: ubuntu-latest, target: aarch64, manylinux: auto }
          - { platform: macos-universal2, runner: macos-latest, target: universal2-apple-darwin, manylinux: "" }
          - { platform: windows-x64, runner: windows-latest, target: x64, manylinux: "" }
    steps:
      - uses: actions/checkout@v7
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: native
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - name: Upload the wheel
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}
          path: native/dist/*

  native-sdist:
    name: Build the ddi-l-native sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: native
          command: sdist
          args: --out dist
      - name: Upload the sdist
        uses: actions/upload-artifact@v7
        with:
          name: native-sdist
          path: native/dist/*

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build, native-wheels, native-sdist]
    if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        # ddi-l and ddi-l-native: each project needs this repository set up
        # as a trusted publisher on the index.
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true
      - name: Publish to TestPyPI
        # SHA-pinned (v1.14.2): this action holds a token that can publish.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          repository-url: https://test.pypi.org/legacy/

  publish:
    name: Publish to PyPI
    needs: [build, native-wheels, native-sdist]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        # ddi-l and ddi-l-native: each project needs this repository set up
        # as a trusted publisher on the index.
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true
      - name: Publish to PyPI
        # SHA-pinned (v1.14.2). PEP 740 attestations are generated by default
        # with `id-token: write`.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
