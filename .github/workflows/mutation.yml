name: Mutation testing

# Monthly and on demand, not on every PR: a full run takes hours of Actions
# minutes. The same schedule fuzzes the native parser (see `fuzz-native`). It fails when a mutant survives that tests/mutation_baseline.txt
# does not list, or when a listed one no longer survives (see
# scripts/check_mutation.py).
on:
  schedule:
    # The 1st of each month, 06:00 UTC.
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      mutants:
        description: >-
          Specific mutant names to run (space-separated), e.g.
          "ddi_l.io.x__tree_uses_namespace__mutmut_5". Empty runs everything in
          scope.
        required: false
        default: ""

# Read-only token for every job: none of them pushes, comments or releases.
# Artifact uploads and the uv cache use the runner's own token, not this one.
permissions:
  contents: read

env:
  UV_VERSION: "0.13.7"

jobs:
  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    # About 15,800 mutants: 100 minutes on four cores, so a few hours on a
    # hosted runner (property tests draw 30 examples under mutmut, see
    # tests/helpers/examples.py). 360 minutes is the most a hosted job may
    # run; a run killed halfway leaves no result.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --group dev --extra full --extra server
      - name: Run mutmut
        run: uv run mutmut run ${{ inputs.mutants }}
      - name: Compare with the baseline
        # A run limited to some mutants leaves the rest unchecked.
        if: inputs.mutants == ''
        run: uv run python scripts/check_mutation.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save the results
        if: always()
        run: uv run mutmut results > mutmut-results.txt
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutmut-results
          path: mutmut-results.txt
          if-no-files-found: warn

  fuzz-native:
    # Random and damaged XML through the native parser, checked against the
    # standard library's: the same documents read, the same trees, the same
    # documents refused (and a document type declaration always refused).
    name: Fuzz the native parser
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: inputs.mutants == ''
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        # The real core over uv.lock's stand-in; `--no-sync` below keeps it.
        run: |
          uv sync --locked --group dev
          uv pip install --reinstall-package ddi-l-native ./native
      - name: Fuzz
        env:
          DDI_L_XML_BACKEND: native
          DDI_L_FUZZ_EXAMPLES: "300000"
        run: uv run --no-sync pytest tests/test_native.py -k "fuzzed or damaged" --no-cov -q
