name: Deploy documentation

# The site shows the newest release only, at /ddi-l/latest/. A release
# publishes its docs and replaces whatever the site held before; a manual run
# republishes from the branch it runs on (to fix a page between releases).
on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

env:
  UV_VERSION: "0.13.7"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      # The same locked toolchain as the `docs` job in ci.yml.
      - name: Install the locked documentation toolchain
        run: uv sync --locked --group docs

      - name: Build documentation (strict)
        run: uv run python scripts/docs.py build --strict

      # The gh-pages branch holds the built site under latest/, and at its
      # root: index.html, which redirects to latest/; 404.html, which GitHub
      # Pages serves for any missing path and which sends links without
      # latest/ (or under an older version) to the same page under latest/;
      # and .nojekyll, so Pages serves the files as they are. Each deploy is a
      # new commit on the branch: its history is kept.
      - name: Publish to the gh-pages branch
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          TAG_NAME="${TAG_NAME:-$(git describe --tags --abbrev=0)}"
          PAGES="$RUNNER_TEMP/gh-pages"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if git fetch origin gh-pages:gh-pages; then
            git worktree add "$PAGES" gh-pages
          else
            git worktree add --orphan -b gh-pages "$PAGES"
          fi
          git -C "$PAGES" rm -rq --ignore-unmatch .
          mkdir -p "$PAGES/latest"
          cp -R site/. "$PAGES/latest/"
          cp .github/pages/index.html .github/pages/404.html "$PAGES/"
          touch "$PAGES/.nojekyll"
          git -C "$PAGES" add -A
          if git -C "$PAGES" diff --cached --quiet; then
            echo "The published site is up to date"
          else
            git -C "$PAGES" commit -q -m "Publish the documentation for $TAG_NAME"
            git -C "$PAGES" push origin gh-pages
          fi
