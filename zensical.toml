# The documentation site, configured for Zensical: https://zensical.org/
#
# This file builds the English site and zensical.fr.toml the French one. The
# French file repeats this one with French text; tests/test_docs_site_config.py
# checks that the rest of the two stays the same. scripts/docs.py stages
# docs/*.en.md into .docs-build/en and runs Zensical on this file:
#
#     uv run python scripts/docs.py build --strict
#
# Links to a page or heading that does not exist fail the strict build.

[project]
site_name = "ddi-l"
site_description = "Document surveys and datasets with DDI Lifecycle, in Python: write, read, validate and lint DDI 3.3 metadata."
copyright = "ddi-l is MIT licensed. Colectica is a trademark of its owner; ddi-l is an independent project, not affiliated with or endorsed by Colectica."
site_url = "https://pbisson44.github.io/ddi-l/latest/"
repo_url = "https://github.com/pbisson44/ddi-l"
repo_name = "pbisson44/ddi-l"
# Zensical links to the staged page (docs/index.md); partials/actions.html in
# docs/overrides puts the language suffix back for the edit button.
edit_uri = "edit/main/docs/"
docs_dir = ".docs-build/en"
site_dir = ".docs-build/site/en"
extra_css = [
  "assets/stylesheets/palette.css",
  "assets/stylesheets/site.css",
]

# Pages deliberately left out of the nav: the branding notes (linked from the
# development guide) and the retired tutorials, kept as pointers to the
# curriculum so old links still work.
not_in_nav = """
/assets/README.md
/tutorials/authoring.md
/tutorials/persona-learning-paths.md
/tutorials/training-labs.md
"""

