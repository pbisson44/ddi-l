[project.theme]
# Zensical's current design. The HTML is the same as the classic variant's,
# so the overrides in docs/overrides work with both.
variant = "modern"
custom_dir = "docs/overrides"
language = "en"
# A favicon needs its own background, so it is a separate file from the
# header logo, which draws in `currentColor`.
favicon = "assets/favicon.svg"
font.text = "Inter"
font.code = "JetBrains Mono"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.share",
  "search.suggest",
  "toc.follow",
]

[project.theme.icon]
# docs/overrides/.icons/ddi/logo.svg, inlined so it takes the header colour.
logo = "ddi/logo"
repo = "fontawesome/brands/github"
edit = "material/pencil-outline"
view = "material/file-eye-outline"

# The toggle follows the system setting until the reader picks light or dark.
# Colours are in docs/assets/stylesheets/palette.css; `primary = "custom"`
# keeps the theme's own palette from overriding them. Readers who ask their
# system for more contrast get the high-contrast colours there automatically.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "material/weather-night"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
# Renders the `- [ ]` checklists used in the curriculum.
pymdownx.tasklist.custom_checkbox = true
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"

[project.plugins.search]
separator = '[\s\-\.]+'

# The API and model references, generated from the docstrings.
[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = false
show_root_full_path = false
show_signature_annotations = true
separate_signature = true
signature_crossrefs = true
merge_init_into_class = true
filters = ["!^_"]

[project.extra]
generator = false

# The bar above the header (docs/overrides/main.html). A reader who
# dismisses it sees it again once the text changes.
[project.extra.announce]
text = "New in the course: optional modules on DDI-Codebook and DDI-CDI."
link = "curriculum/"
link_label = "See the course"

# The language selector; each build is one language.
[[project.extra.alternate]]
name = "English"
link = "/ddi-l/latest/"
lang = "en"

[[project.extra.alternate]]
name = "Français"
link = "/ddi-l/latest/fr/"
lang = "fr"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/pbisson44/ddi-l"
name = "ddi-l on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/ddi-l/"
name = "ddi-l on PyPI"
