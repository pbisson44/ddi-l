theme:
  name: material
  custom_dir: docs/overrides
  language: en
  logo: assets/logo.svg
  # Separate from logo.svg, which draws in `currentColor`; a favicon needs its
  # own background.
  favicon: assets/favicon.svg
  font:
    text: "Inter"
    code: "JetBrains Mono"
  icon:
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    # `navigation.instant` is incompatible with the mkdocs-static-i18n language
    # switcher (`mkdocs build --strict` fails), so it stays off.
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - palette.switcher
    - palette.toggle
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  # Only the light and dark palettes are on the header toggle; the
  # accessibility palettes are chosen from the menu in docs/overrides/main.html.
  # `media:` follows the OS colour preference on a first visit.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    # Accessibility palettes (indices 2-5): off the toggle cycle, selected via
    # Material's own radio inputs so Material persists the choice.
    - scheme: high-contrast
    - scheme: deuteranopia
    - scheme: protanopia
    - scheme: tritanopia
plugins:
  - search:
      lang:
        - en
        - fr
      separator: '[\s\-\.]+'
  # Social cards are off: rendering them downloads a font from
  # fonts.google.com at build time, which the deploy should not depend on.

  # Must be listed before `i18n`, which rebuilds the plugin chain per locale.
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters: ["!^_"]
  - mike:
      canonical_version: latest
      version_selector: true
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
