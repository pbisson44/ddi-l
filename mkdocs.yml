markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      # Needed by the `content.code.annotate` and `content.code.copy` features.
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # Renders the `- [ ]` checklists used in the curriculum.
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      # Heading anchors.
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
hooks:
  - hooks/copy_sitemap.py
  - hooks/version_selector.py
  - hooks/quiet_i18n_logs.py
extra_css:
