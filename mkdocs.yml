markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      # Needed by the `content.code.annotate` and `content.code.copy` features.
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # Renders the `- [ ]` checklists used in the curriculum.
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      # Heading anchors.
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
hooks:
  - hooks/copy_sitemap.py
  - hooks/version_selector.py
  - hooks/quiet_i18n_logs.py
  - hooks/answer_keys.py
extra_css:
  - assets/stylesheets/palette.css
  - assets/stylesheets/accessibility.css
  - assets/stylesheets/landing.css
extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pbisson44/ddi-l
      name: ddi-l on GitHub
  generator: false
  # Fallbacks for a build without the i18n plugin's per-locale `extra`.
  palette_menu_label: Accessibility palettes
  palette_labels:
    default: Light mode enabled
    slate: Dark mode enabled
    high-contrast: High contrast
    deuteranopia: Deuteranopia-friendly
    protanopia: Protanopia-friendly
    tritanopia: Tritanopia-friendly
  outdated_message: "You're viewing documentation for an <strong>older version</strong>."
  outdated_link_label: View the latest version
