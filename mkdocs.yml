site_name: "ddi-l: DDI Lifecycle"
site_description: Reference and tutorials for the ddi-l toolkit.
site_url: https://pbisson44.github.io/ddi-l/
repo_url: https://github.com/pbisson44/ddi-l
repo_name: pbisson44/ddi-l
edit_uri: edit/main/docs/
site_dir: site
# Pages deliberately left out of the nav: the branding notes (linked from the
# development guide) and the retired tutorials, kept as pointers to the
# curriculum so old links still work. Listing them here stops MkDocs reporting
# them on every build.
not_in_nav: |
  /assets/README.*.md
  /tutorials/authoring.*.md
  /tutorials/persona-learning-paths.*.md
  /tutorials/training-labs.*.md
# This nav appears three times: here (fallback without the i18n plugin) and
# under each `i18n` locale below. Keep all three in step when adding a page.
