  - Home:
      - index.md
      - Install ddi-l: installation.md
  - Learn:
      - curriculum/index.md
      - "Module 1: What is metadata?": curriculum/module-01-what-is-metadata.md
      - "Module 2: Set up your environment": curriculum/module-02-setup.md
      - "Module 3: Create your first study": curriculum/module-03-first-study.md
      - "Module 4: Variables and questions": curriculum/module-04-variables.md
      - "Module 5: Concepts and universes": curriculum/module-05-concepts-universes.md
      - "Module 6: Open and modify files": curriculum/module-06-open-modify.md
      - "Module 7: Validate from the command line": curriculum/module-07-cli-validation.md
      - "Module 8: From CSV/Excel to DDI": curriculum/module-08-csv-to-ddi.md
      - "Module 9: Code lists": curriculum/module-09-code-lists.md
      - "Module 10: Questionnaire flows": curriculum/module-10-questionnaire-flows.md
      - "Module 11: Data lineage": curriculum/module-11-data-lineage.md
      - "Module 12: Data linkage": curriculum/module-12-data-linkage.md
      - "Module 13: Properties, find, and validate": curriculum/module-13-properties-find-validate.md
      - "Module 14: Custom fields": curriculum/module-14-custom-fields.md
      - "Module 15: Update and version": curriculum/module-15-update-and-version.md
      - "Module 16: Capstone projects": curriculum/module-16-capstone.md
      - Instructor guide: curriculum/instructor-guide.md
      - Cheat sheet: curriculum/cheat-sheet.md
      - Answer keys: curriculum/answer-keys.md
  - How-to guides:
      - Validate and lint DDI content: validation.md
      - Use the command line: cli-recipes.md
      - Automate validation in CI: tutorials/automation-playbook.md
      - Troubleshoot schema errors: tutorials/schema-troubleshooting-clinic.md
      - Reuse fragments: tutorials/fragment-reuse-lab.md
      - Move between XML and objects: tutorials/xml-to-objects.md
      - Serve the HTTP API: server.md
      - Use ddi-l from R: r-users.md
      - Build tools and applications: tutorials/building-tools.md
  - Reference:
      - User guide: user-guide.md
      - API reference: api.md
      - Models reference: models.md
      - Namespace catalog: namespaces.md
      - Schema coverage: schema-coverage.md
  - About:
      - Release notes: release-notes.md
      - Performance playbook:
          - performance.md
          - Schema conversion benchmark: performance/schema_conversion.md
      - Related Python packages: ddi-l-friendly-packages.md
      - Development guide: DEVELOPMENT.md
theme:
  name: material
  custom_dir: docs/overrides
  language: en
  logo: assets/logo.svg
  # Separate from logo.svg, which draws in `currentColor`; a favicon needs its
  # own background.
  favicon: assets/favicon.svg
  font:
    text: "Inter"
    code: "JetBrains Mono"
  icon:
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    # `navigation.instant` is incompatible with the mkdocs-static-i18n language
    # switcher (`mkdocs build --strict` fails), so it stays off.
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - palette.switcher
    - palette.toggle
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  # Only the light and dark palettes are on the header toggle; the
  # accessibility palettes are chosen from the menu in docs/overrides/main.html.
  # `media:` follows the OS colour preference on a first visit.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    # Accessibility palettes (indices 2-5): off the toggle cycle, selected via
    # Material's own radio inputs so Material persists the choice.
    - scheme: high-contrast
    - scheme: deuteranopia
    - scheme: protanopia
    - scheme: tritanopia
plugins:
  - search:
      lang:
        - en
        - fr
      separator: '[\s\-\.]+'
  # Social cards are off: rendering them downloads a font from
  # fonts.google.com at build time, which the deploy should not depend on.

  # Must be listed before `i18n`, which rebuilds the plugin chain per locale.
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters: ["!^_"]
  - mike:
      canonical_version: latest
      version_selector: true
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          nav:
            - Home:
                - index.md
                - Install ddi-l: installation.md
            - Learn:
                - curriculum/index.md
                - "Module 1: What is metadata?": curriculum/module-01-what-is-metadata.md
                - "Module 2: Set up your environment": curriculum/module-02-setup.md
                - "Module 3: Create your first study": curriculum/module-03-first-study.md
                - "Module 4: Variables and questions": curriculum/module-04-variables.md
                - "Module 5: Concepts and universes": curriculum/module-05-concepts-universes.md
                - "Module 6: Open and modify files": curriculum/module-06-open-modify.md
                - "Module 7: Validate from the command line": curriculum/module-07-cli-validation.md
                - "Module 8: From CSV/Excel to DDI": curriculum/module-08-csv-to-ddi.md
                - "Module 9: Code lists": curriculum/module-09-code-lists.md
                - "Module 10: Questionnaire flows": curriculum/module-10-questionnaire-flows.md
                - "Module 11: Data lineage": curriculum/module-11-data-lineage.md
                - "Module 12: Data linkage": curriculum/module-12-data-linkage.md
                - "Module 13: Properties, find, and validate": curriculum/module-13-properties-find-validate.md
                - "Module 14: Custom fields": curriculum/module-14-custom-fields.md
                - "Module 15: Update and version": curriculum/module-15-update-and-version.md
                - "Module 16: Capstone projects": curriculum/module-16-capstone.md
                - Instructor guide: curriculum/instructor-guide.md
