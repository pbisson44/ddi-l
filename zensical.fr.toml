# The French documentation site, configured for Zensical. It is zensical.toml
# with French text: the description, copyright, site URL and folders, the nav
# titles, the theme's language, the palette toggle names and the announcement.
# tests/test_docs_site_config.py checks that everything else stays the same as
# in zensical.toml, so a change to the theme, extensions or plugins goes in both.

[project]
site_name = "ddi-l"
site_description = "Documenter des enquêtes et des jeux de données avec DDI Lifecycle, en Python : écrire, lire, valider et analyser des métadonnées DDI 3.3."
copyright = "ddi-l est publié sous licence MIT. Colectica est une marque de son propriétaire ; ddi-l est un projet indépendant, sans lien avec Colectica et non approuvé par elle."
site_url = "https://pbisson44.github.io/ddi-l/latest/fr/"
repo_url = "https://github.com/pbisson44/ddi-l"
repo_name = "pbisson44/ddi-l"
# Zensical links to the staged page (docs/index.md); partials/actions.html in
# docs/overrides puts the language suffix back for the edit button.
edit_uri = "edit/main/docs/"
docs_dir = ".docs-build/fr"
site_dir = ".docs-build/site/fr"
extra_css = [
  "assets/stylesheets/palette.css",
  "assets/stylesheets/site.css",
]

# Pages deliberately left out of the nav: the branding notes (linked from the
# development guide) and the retired tutorials, kept as pointers to the
# curriculum so old links still work.
not_in_nav = """
/assets/README.md
/tutorials/authoring.md
/tutorials/persona-learning-paths.md
/tutorials/training-labs.md
"""

