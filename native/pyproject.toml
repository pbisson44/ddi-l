[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "ddi-l-native"
version = "0.2.0"
description = "Native XML core for ddi-l: a fast parser and an element tree that keeps its source"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Text Processing :: Markup :: XML",
]

[project.urls]
Homepage = "https://github.com/pbisson44/ddi"

[tool.maturin]
python-source = "python"
module-name = "ddi_l_native._core"
features = ["pyo3/extension-module"]
