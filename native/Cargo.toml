[package]
name = "ddi-l-native"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Native XML core for ddi-l: a fast parser and an element tree that keeps its source"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py311"] }
blake2 = "0.10"
memchr = "2"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[profile.release]
lto = "fat"
codegen-units = 1
