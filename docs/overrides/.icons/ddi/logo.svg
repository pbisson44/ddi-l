<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"
     aria-hidden="true" focusable="false">
  <!--
    Drawn in `currentColor` so the mark takes the header's foreground in every
    palette, including high contrast, without a second asset. That only works
    inline: theme.icon.logo in mkdocs.yml makes Material inline this file,
    whereas `theme.logo` would load it as an <img>, where currentColor falls
    back to black. Material inlines it twice (header and navigation drawer),
    so it carries no ids, and it is decorative: the logo link has the site name
    as its label. `fill="none"` sits on the group, not the <svg>: Material's
    stylesheet sets `fill: currentColor` on the <svg>, which would otherwise
    fill every outline.

    The motif is the package: stacked records (a dataset) wrapped by an open
    circular arrow (the DDI *Lifecycle*).
  -->
  <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"
     stroke-linejoin="round">
    <!-- Lifecycle arc, open at the top right for the arrowhead. -->
    <path d="M38.5 14.2A18 18 0 1 1 24 6" />
    <path d="M24 6l-5.6-3.8M24 6l-5.6 4.2" />
    <!-- Stacked records. -->
    <ellipse cx="24" cy="18.4" rx="9.2" ry="3.4" />
    <path d="M14.8 18.4v5.6c0 1.9 4.1 3.4 9.2 3.4s9.2-1.5 9.2-3.4v-5.6" />
    <path d="M14.8 24v5.6c0 1.9 4.1 3.4 9.2 3.4s9.2-1.5 9.2-3.4V24" />
  </g>
</svg>
