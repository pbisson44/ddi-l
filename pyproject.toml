[build-system]
requires = ["poetry-core>=2.0.0,<3"]
build-backend = "poetry.core.masonry.api"

[project]
name = "ddi-l"
version = "0.1.0"
description = "Python toolkit for DDI Lifecycle XML: read, author, validate and lint DDI 3.1, 3.2 and 3.3"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# The bundled DDI XML Schemas (ddi_l/schemas/) are CC-BY-4.0 from the DDI
# Alliance; their license ships with them.
license-files = ["LICENSE", "src/ddi_l/schemas/license.txt"]
authors = [
  { name = "Philippe Bisson", email = "pbisson44@gmail.com" }
]

keywords = [
  "ddi",
  "ddi-lifecycle",
  "metadata",
  "survey",
  "xml",
  "statistics",
  "data-documentation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Environment :: Console",
  "Natural Language :: English",
  "Natural Language :: French",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Markup :: XML",
  "Typing :: Typed",
]

dependencies = [
  "xmlschema>=2.4",
  "defusedxml>=0.7",
  "orjson>=3.9",
]

[project.urls]
Homepage = "https://github.com/pbisson44/ddi-l"
Documentation = "https://pbisson44.github.io/ddi-l/"
Repository = "https://github.com/pbisson44/ddi-l"
Issues = "https://github.com/pbisson44/ddi-l/issues"
Changelog = "https://github.com/pbisson44/ddi-l/blob/main/docs/release-notes.en.md"

[project.optional-dependencies]
full = [
  "lxml>=4.9",
]
# The HTTP API (ddi_l.server, `ddi serve`).
server = [
    "litestar>=2.12,<3",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
# Documentation site toolchain (a dependency group, not a published extra).
# uv.lock pins the versions CI and the deploy use; the major-version caps
# mean a new major is adopted deliberately.
docs = [
  "mkdocs>=1.5,<2",
  "mkdocs-material>=9.7.7,<10",
  "pymdown-extensions>=10",
  "mkdocs-static-i18n>=1.2",
  "mike>=2.0",
  # Generates the API reference from the docstrings.
  "mkdocstrings[python]>=0.26",
]

# ruff and mypy are pinned exactly because new releases change what they
# report; bump them deliberately.
dev = [
  "build>=1.2",
  "hypothesis>=6.70",
  "mutmut",
  "mypy==2.3.0",
  "pytest>=7.0",
  "pytest-cov>=5.0",
  "rdflib>=7.0",
  "ruff==0.16.1",
]

[project.scripts]
ddi = "ddi_l.cli:main"

# The sdist carries the test suite and project metadata so redistributors can
# build and test from it; scripts/check_distributions.py checks the contents.
[tool.poetry]
include = [
  { path = "tests", format = "sdist" },
  { path = "scripts", format = "sdist" },
  # Imported by tests/test_roundtrip_fidelity.py and test_schema_versions.py.
  { path = "codegen", format = "sdist" },
  { path = "Makefile", format = "sdist" },
  { path = "uv.lock", format = "sdist" },
  { path = "CHANGELOG.md", format = "sdist" },
  { path = "CITATION.cff", format = "sdist" },
  { path = "CONTRIBUTING.md", format = "sdist" },
  { path = "CODE_OF_CONDUCT.md", format = "sdist" },
  { path = "SECURITY.md", format = "sdist" },
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
extend-exclude = ["src/ddi_l/models/_generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "D"]
ignore = [
  "D105",  # missing docstring in magic method
  "D107",  # missing docstring in __init__
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "E501", "RUF012", "N806", "N813", "SIM117", "B017", "SIM105", "E402", "RUF043"]
"codegen/**" = ["D", "E501", "N806", "SIM105"]
"benchmarks/**" = ["D", "E402", "E501", "B018"]
"demo/**" = ["D"]
"src/ddi_l/examples/**" = ["D", "E402", "B007", "E501"]
"src/ddi_l/models/_generated/**" = ["D"]
"src/ddi_l/models/*.py" = ["D102"]
"src/ddi_l/cli.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
exclude = [
    "src/ddi_l/examples/",
    "codegen/",
    "demo/",
    "benchmarks/",
    "hooks/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root only, so `tests.helpers` and `codegen` import. `src`
# is left off so tests run against the installed package
# (`uv sync --group dev`).
pythonpath = ["."]
addopts = "--cov=ddi_l --cov-report=term-missing"
markers = [
    # Deselect with `-m "not docs"`; CI runs them in a dedicated job.
    "docs: executes the samples embedded in the documentation",
]

[tool.coverage.run]
source = ["ddi_l"]
omit = [
    "src/ddi_l/examples/build_and_validate.py",
    "src/ddi_l/examples/tests/fixtures/models/regenerate.py",
    "src/ddi_l/models/_generated/dataset.py",
    "src/ddi_l/models/_generated/ddiprofile.py",
    "src/ddi_l/models/_generated/instance.py",
    "src/ddi_l/models/_generated/physicaldataproduct_ncube_*.py",
    "src/ddi_l/models/_generated/physicaldataproduct_proprietary.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@overload",
    "raise NotImplementedError",
]

# Mutation testing is scoped to the hand-written decision logic; widen
# `only_mutate` when adding a module with real branching. `--no-cov` keeps the
# coverage gate from counting mutants as killed for the wrong reason.
[tool.mutmut]
source_paths = ["src/ddi_l"]
# Tests import codegen, which mutmut does not copy by default.
also_copy = ["codegen"]
only_mutate = [
  "src/ddi_l/lint.py",
  "src/ddi_l/io.py",
  "src/ddi_l/operations.py",
  "src/ddi_l/schema_loader/_conversion.py",
]
do_not_mutate = [
  "src/ddi_l/models/_generated/*",
  "src/ddi_l/schemas/*",
]
pytest_add_cli_args = ["--no-cov", "-q", "-p", "no:cacheprovider"]
# Only the tests that exercise the mutated modules.
pytest_add_cli_args_test_selection = [
  "tests/test_lint.py",
  "tests/test_lint_edge_cases.py",
  "tests/test_io.py",
  "tests/test_io_coverage.py",
  "tests/test_conversion_coverage.py",
  "tests/test_conversion_runtime.py",
  "tests/test_document_dict_roundtrip.py",
  "tests/test_backend_parity.py",
  "tests/test_validation.py",
]
