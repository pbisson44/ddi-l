[build-system]
requires = ["poetry-core>=2.0.0,<3"]
build-backend = "poetry.core.masonry.api"

[project]
name = "ddi-l"
version = "0.2.0"
description = "Python toolkit for DDI Lifecycle XML: read, author, validate and lint DDI 3.1, 3.2 and 3.3"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# The bundled DDI XML Schemas (ddi_l/schemas/) are CC-BY-4.0 from the DDI
# Alliance; their license ships with them.
license-files = ["LICENSE", "src/ddi_l/schemas/license.txt"]
authors = [
  { name = "Philippe Bisson", email = "pbisson44@gmail.com" }
]

keywords = [
  "ddi",
  "ddi-lifecycle",
  "metadata",
  "survey",
  "xml",
  "statistics",
  "data-documentation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Environment :: Console",
  "Natural Language :: English",
  "Natural Language :: French",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Markup :: XML",
  "Typing :: Typed",
]

dependencies = [
  "xmlschema>=2.4",
  "defusedxml>=0.7",
  "orjson>=3.9",
  # The native XML core, at ddi-l's own version. A compiled wheel where one
  # fits; elsewhere a pure-Python stand-in (native/fallback), and ddi-l uses
  # lxml or the standard library. Nothing is ever compiled at install time.
  "ddi-l-native==0.2.0",
]

[project.urls]
Homepage = "https://github.com/pbisson44/ddi-l"
Documentation = "https://pbisson44.github.io/ddi-l/"
Repository = "https://github.com/pbisson44/ddi-l"
Issues = "https://github.com/pbisson44/ddi-l/issues"
Changelog = "https://github.com/pbisson44/ddi-l/blob/main/docs/release-notes.en.md"

[project.optional-dependencies]
full = [
  "lxml>=4.9",
]
# The HTTP API (ddi_l.server, `ddi serve`).
server = [
    "litestar>=2.12,<3",
    "uvicorn[standard]>=0.30",
]
# Questionnaire specs in YAML or JSON (ddi_l.spec, `ddi spec`, `ddi conform`).
spec = [
    "PyYAML>=6.0",
    "jsonschema>=4.18",
]
# Deciding whether two gates hold for the same respondents (ddi_l.spec.decide);
# equivalent, compile_condition and conform use it when it is installed.
logic = [
    "z3-solver>=4.13",
]

[dependency-groups]
# Documentation site toolchain (a dependency group, not a published extra).
# uv.lock pins the versions CI and the deploy use; the major-version caps
# mean a new major is adopted deliberately.
docs = [
  "mkdocs>=1.5,<2",
  "mkdocs-material>=9.7.7,<10",
  "pymdown-extensions>=10",
  "mkdocs-static-i18n>=1.2",
  "mike>=2.0",
  # Generates the API reference from the docstrings.
  "mkdocstrings[python]>=0.26",
]

# ruff, mypy and mutmut are pinned exactly because new releases change what
# they report (mutmut also renames mutants, which the baseline lists); bump
# them deliberately.
dev = [
  "build>=1.2",
  "hypothesis>=6.70",
  "mutmut==3.8.1",
  "mypy==2.3.0",
  "pytest>=7.0",
  "pytest-cov>=5.0",
  # Runs the suite on every core (-n auto in addopts).
  "pytest-xdist>=3.6",
  "rdflib>=7.0",
  "ruff==0.16.1",
  # The spec extra, so every CI leg tests and type-checks ddi_l.spec.
  "PyYAML>=6.0",
  "jsonschema>=4.18",
  "types-PyYAML",
  "types-jsonschema",
  # The logic extra, so every CI leg tests the solver.
  "z3-solver>=4.13",
]

# Developing in this repository, ddi-l-native is the pure-Python stand-in, so
# no one needs Rust; the native core is built on request (docs/DEVELOPMENT).
[tool.uv.sources]
ddi-l-native = { path = "native/fallback" }

[project.scripts]
ddi = "ddi_l.cli:main"

# The sdist carries the test suite and project metadata so redistributors can
# build and test from it; scripts/check_distributions.py checks the contents.
[tool.poetry]
include = [
  { path = "tests", format = "sdist" },
  { path = "scripts", format = "sdist" },
  # Imported by tests/test_roundtrip_fidelity.py and test_schema_versions.py.
  { path = "codegen", format = "sdist" },
  { path = "Makefile", format = "sdist" },
  { path = "uv.lock", format = "sdist" },
  # The native core's sources, and the stand-in uv.lock installs.
  { path = "native/Cargo.toml", format = "sdist" },
  { path = "native/Cargo.lock", format = "sdist" },
  { path = "native/pyproject.toml", format = "sdist" },
  { path = "native/README.md", format = "sdist" },
  { path = "native/src/*.rs", format = "sdist" },
  { path = "native/python/ddi_l_native/__init__.py", format = "sdist" },
  { path = "native/fallback/pyproject.toml", format = "sdist" },
  { path = "native/fallback/README.md", format = "sdist" },
  { path = "native/fallback/ddi_l_native/__init__.py", format = "sdist" },
  { path = "CHANGELOG.md", format = "sdist" },
  { path = "CITATION.cff", format = "sdist" },
  { path = "CONTRIBUTING.md", format = "sdist" },
  { path = "CODE_OF_CONDUCT.md", format = "sdist" },
  { path = "SECURITY.md", format = "sdist" },
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
extend-exclude = ["src/ddi_l/models/_generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "D"]
ignore = [
  "D105",  # missing docstring in magic method
  "D107",  # missing docstring in __init__
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "E501", "RUF012", "N806", "N813", "SIM117", "B017", "SIM105", "E402", "RUF043"]
"codegen/**" = ["D", "E501", "N806", "SIM105"]
"benchmarks/**" = ["D", "E402", "E501", "B018"]
"demo/**" = ["D"]
"src/ddi_l/examples/**" = ["D", "E402", "B007", "E501"]
"src/ddi_l/models/_generated/**" = ["D"]
"src/ddi_l/models/*.py" = ["D102"]
"src/ddi_l/cli.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
exclude = [
    "src/ddi_l/examples/",
    "codegen/",
    "demo/",
    "benchmarks/",
    "hooks/",
]

# The fixture generator, moved out of src/ddi_l/examples/, which mypy skips;
# tests import it, so it is checked unless told otherwise.
[[tool.mypy.overrides]]
module = "tests.helpers.regenerate_model_fixtures"
ignore_errors = true

# z3-solver ships no type information.
[[tool.mypy.overrides]]
module = "z3"
ignore_missing_imports = true

# The native extension is untyped (and only a stand-in in this repository);
# ddi_l types its elements by the protocol in _etree.pyi.
[[tool.mypy.overrides]]
module = "ddi_l_native"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root only, so `tests.helpers` and `codegen` import. `src`
# is left off so tests run against the installed package
# (`uv sync --group dev`).
pythonpath = ["."]
# Every core (pytest-xdist); pass -n 0 to run in one process (for --pdb).
addopts = "-n auto --cov=ddi_l --cov-report=term-missing"
markers = [
    # Deselect with `-m "not docs"`; CI runs them in a dedicated job.
    "docs: executes the samples embedded in the documentation",
]
filterwarnings = [
    # A test whose items refer to items outside the document says so, with
    # `pytest.warns` or a filterwarnings mark; any other one fails.
    "error::ddi_l.exceptions.DDIReferenceWarning",
    # rdflib 7's own JSON-LD parser builds its deprecated ConjunctiveGraph
    # whatever graph it is given; nothing ddi-l or a test can change.
    "ignore:ConjunctiveGraph is deprecated:DeprecationWarning:rdflib.plugins.parsers.jsonld",
]

[tool.coverage.run]
source = ["ddi_l"]
omit = [
    "src/ddi_l/examples/build_and_validate.py",
    "src/ddi_l/models/_generated/dataset.py",
    "src/ddi_l/models/_generated/ddiprofile.py",
    "src/ddi_l/models/_generated/instance.py",
    "src/ddi_l/models/_generated/physicaldataproduct_ncube_*.py",
    "src/ddi_l/models/_generated/physicaldataproduct_proprietary.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@overload",
    "raise NotImplementedError",
]

# Mutation testing is scoped to the hand-written decision logic; widen
# `only_mutate` when adding a module with real branching. `--no-cov` keeps the
# coverage gate from counting mutants as killed for the wrong reason.
[tool.mutmut]
source_paths = ["src/ddi_l"]
# Tests import codegen, which mutmut does not copy by default.
also_copy = ["codegen"]
only_mutate = [
  "src/ddi_l/_facts.py",
  "src/ddi_l/_incremental.py",
  "src/ddi_l/colectica_edit.py",
  "src/ddi_l/colectica_lint.py",
  "src/ddi_l/colectica_logic.py",
  "src/ddi_l/io.py",
  "src/ddi_l/lint.py",
  "src/ddi_l/operations.py",
  "src/ddi_l/schema_loader/_conversion.py",
  "src/ddi_l/spec/_instrument.py",
  "src/ddi_l/spec/_routing.py",
  "src/ddi_l/spec/_smt.py",
  "src/ddi_l/spec/compile.py",
  "src/ddi_l/spec/conform.py",
  "src/ddi_l/spec/expression.py",
  "src/ddi_l/spec/semantics.py",
  "src/ddi_l/validation.py",
]
do_not_mutate = [
  "src/ddi_l/models/_generated/*",
  "src/ddi_l/schemas/*",
]
# -n 0: mutmut runs the tests in its own processes, one mutant at a time.
pytest_add_cli_args = ["--no-cov", "-n", "0", "-q", "-p", "no:cacheprovider"]
# Only the tests that exercise the mutated modules.
pytest_add_cli_args_test_selection = [
  "tests/test_lint.py",
  "tests/test_lint_edge_cases.py",
  # Pins every rule's output on the fixtures.
  "tests/test_lint_default_pinned.py",
  "tests/test_colectica_part_a.py",
  "tests/test_io.py",
  "tests/test_io_coverage.py",
  "tests/test_inline_xhtml_space.py",
  "tests/test_conversion_coverage.py",
  "tests/test_conversion_runtime.py",
  "tests/test_document_dict_roundtrip.py",
  "tests/test_backend_parity.py",
  "tests/test_validation.py",
  "tests/test_spec_expression.py",
  "tests/test_spec_compile.py",
  "tests/test_spec_conform.py",
  "tests/test_spec_semantics.py",
  "tests/test_instrument_paths.py",
  "tests/test_facts.py",
  "tests/test_flow_walks.py",
  "tests/test_lint_configuration.py",
  "tests/test_xml_security.py",
  "tests/test_colectica_edit.py",
  "tests/test_revise_oracle.py",
  "tests/test_incremental.py",
  "tests/test_routing.py",
  "tests/test_colectica_fragment.py",
  "tests/test_colectica_lint.py",
  "tests/test_colectica_logic.py",
  "tests/test_validation_coverage.py",
  "tests/test_validations.py",
  # operations.py is mostly reached through the HTTP API and the CLI.
  "tests/test_operations.py",
  "tests/test_jsonld.py",
  "tests/test_server.py",
  "tests/test_version_detection.py",
]
